server {
    listen 443 ssl;
    server_name valelabs.valemilk.com.br;

    # Logs
    access_log /var/log/nginx/valelabs.access.log;
    error_log /var/log/nginx/valelabs.error.log;

    # Proxy para o container Docker na porta 8083
    location / {
        proxy_pass http://localhost:8083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    ssl_certificate /etc/letsencrypt/live/valelabs.valemilk.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/valelabs.valemilk.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name valelabs.valemilk.com.br;

    return 301 https://$host$request_uri;
}
